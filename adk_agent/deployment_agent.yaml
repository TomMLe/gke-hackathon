apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-agent
  template:
    metadata:
      labels:
        app: adk-agent
    spec:
      containers:
      - name: adk-agent
        image: us-west1-docker.pkg.dev/<PROJECT_ID>/gke-hackathon/adk-agent:latest
        command: ["streamlit", "run", "--server.port=8080", "main.py"]
        stdin: true
        tty: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 1Gi
            cpu: 2
        ports:
        - containerPort: 8080
        env:
          - name: GOOGLE_API_KEY
            value: <GOOGLE_API_KEY>
          - name: PYTHONDONTWRITEBYTECODE
            value: '1'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: LOG_LEVEL
            value: 'INFO'
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: adk-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: adk-agent

